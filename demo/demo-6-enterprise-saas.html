<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAFIVER TI — Enterprise SaaS móvil (DEMO 6)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
/* Estilo: Enterprise SaaS (Mobile) — ui-ux-pro-max. Índigo→violeta, sombras de color, píldoras, pestañas inferiores, hojas inferiores. */
:root{--bg:#f8fafc;--surf:#fff;--text:#0f172a;--muted:#546179;--primary:#4f46e5;--secondary:#7c3aed;--success:#0b7a55;--border:#e2e8f0;--rcard:16px;--rpill:999px;--rin:8px;--shc:0 4px 16px rgba(79,70,229,.10);
--grad:linear-gradient(135deg,#4f46e5,#7c3aed);--okb:#dcfaf0;--wn:#8a4b00;--wnb:#fff1d6;--bd:#a4161a;--bdb:#fde7e7;--nt:#334155;--ntb:#eef2f7;--pad:20px;--tab:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#e8ebf5;color:var(--text);font-size:15px;line-height:1.5}
.demo{background:#7c2d12;color:#fff;text-align:center;font-size:12px;font-weight:600;padding:6px 10px}
.phone{max-width:460px;margin:0 auto;min-height:calc(100vh - 29px);background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--border);display:flex;flex-direction:column}
@media(min-width:520px){.phone{margin:18px auto;min-height:0;height:min(860px,calc(100vh - 66px));border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(79,70,229,.2),0 0 0 8px #0f172a}}
.top{padding:calc(14px + env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.scroll{flex:1;overflow:auto;padding:4px var(--pad) calc(var(--tab) + 90px)}
.scroll:focus-visible{outline:3px solid var(--primary);outline-offset:-3px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 28px rgba(79,70,229,.35);margin-bottom:14px}
.hero .l{font-size:13px;font-weight:600;opacity:.95;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hero .v{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0 2px}.hero .c{font-size:13px;opacity:.95}
.hero .trk{height:10px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:12px;position:relative;overflow:hidden}.hero .trk i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .meta{position:absolute;top:-2px;width:3px;height:14px;background:#0f172a}
.hero .st{background:#fff;color:#3730a3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
button.card,.card{background:var(--surf);border-radius:var(--rcard);box-shadow:var(--shc);padding:14px;text-align:left}
button.card{all:unset;box-sizing:border-box;background:var(--surf);border-radius:var(--rcard);box-shadow:var(--shc);padding:14px;cursor:pointer;display:block;min-height:96px}
button.card:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
button.card .l{font-size:12px;font-weight:600;color:var(--muted)}button.card .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
button.card.r .v{color:var(--bd)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:var(--rpill);white-space:nowrap}
.st.g{background:var(--okb);color:var(--success)}.st.a{background:var(--wnb);color:var(--wn)}.st.r{background:var(--bdb);color:var(--bd)}.st.n{background:var(--ntb);color:var(--nt)}
h2{font-size:16px;font-weight:700;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center}
.item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;background:var(--surf);border-radius:var(--rcard);box-shadow:var(--shc);padding:14px;margin-bottom:10px;cursor:pointer;min-height:64px}
.item:focus-visible{outline:3px solid var(--primary);outline-offset:2px}.item b{font-size:15px;font-weight:700}.item small{color:var(--muted);font-size:12px;grid-column:1/-1}
.item.r{border-left:5px solid var(--bd)}.item.a{border-left:5px solid #d97706}
.search{position:relative;margin-bottom:12px}.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.search input{width:100%;min-height:48px;border-radius:var(--rpill);border:1.5px solid var(--border);background:#fff;padding:0 16px 0 42px;font:inherit;color:var(--text)}
.search input:focus{border-color:var(--primary);outline:3px solid rgba(79,70,229,.25);outline-offset:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{all:unset;box-sizing:border-box;white-space:nowrap;border:1.5px solid var(--border);background:#fff;border-radius:var(--rpill);padding:0 16px;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;font-weight:600;font-size:13px;color:var(--nt)}
.chip[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent}.chip:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.tabs button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs button i{font-size:22px}.tabs button[aria-current=page]{color:var(--primary)}.tabs button[aria-current=page] i{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tabs button:focus-visible{outline:3px solid var(--primary);outline-offset:-4px;border-radius:12px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bd);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* botones */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--rpill);font-weight:700;font-size:15px;cursor:pointer;background:#fff;color:var(--primary);border:1.5px solid var(--primary);text-align:center}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(79,70,229,.32)}.btn.full{display:flex;width:100%}
.btn[aria-disabled=true]{background:var(--ntb);color:var(--nt);border:1.5px dashed #94a3b8;box-shadow:none;cursor:not-allowed}
.btn:focus-visible{outline:3px solid #0f172a;outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.btn:active,button.card:active,.item:active,.chip:active{transform:scale(.97)}.btn,button.card,.item,.chip{transition:transform .12s ease}}
.fab{position:absolute;right:var(--pad);bottom:calc(var(--tab) + 16px);z-index:4}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.5);display:none;z-index:20;align-items:flex-end}.scrim.on{display:flex}
.sheet{background:#fff;width:100%;max-height:88%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:no-preference){.scrim.on .sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.grab{width:42px;height:5px;border-radius:99px;background:#cbd5e1;margin:10px auto 2px}
.sh{padding:6px var(--pad) 10px;display:flex;align-items:center;gap:10px}.sh h3{flex:1;font-size:18px;font-weight:800}
.sb{padding:4px var(--pad) 14px;overflow:auto}.sf{padding:12px var(--pad) calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:grid;gap:8px}
.x{all:unset;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--ntb)}.x:focus-visible{outline:3px solid var(--primary)}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin-bottom:12px}dt{font-size:12px;font-weight:700;color:var(--muted)}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.step i{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-style:normal;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.step small{color:var(--muted);display:block;font-size:12px}
/* campos flotantes */
.fl{position:relative;margin-bottom:16px}
.fl input,.fl select,.fl textarea{width:100%;min-height:52px;border:1.5px solid var(--border);border-radius:var(--rin);padding:22px 12px 6px;font:inherit;font-size:15px;background:#fff;color:var(--text)}
.fl textarea{min-height:92px;resize:vertical}
.fl label{position:absolute;left:13px;top:16px;color:var(--muted);font-size:15px;pointer-events:none;transition:all .15s ease;transform-origin:left top}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label,.fl textarea:focus+label,.fl textarea:not(:placeholder-shown)+label,.fl select+label{top:6px;font-size:11px;font-weight:700}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--primary);outline:3px solid rgba(79,70,229,.25);outline-offset:0}
.fl input:focus+label,.fl textarea:focus+label{color:var(--primary)}
.fl.bad input,.fl.bad textarea{border-color:var(--bd)}.err{color:var(--bd);font-size:12px;font-weight:600;margin-top:4px}
.help{font-size:12px;color:var(--muted)}
.sk{height:64px;border-radius:var(--rcard);background:#e6e8f8;margin-bottom:10px}
@media(prefers-reduced-motion:no-preference){.sk{animation:pl 1.1s ease-in-out infinite}@keyframes pl{50%{opacity:.5}}}
.toast{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--tab) + 18px);background:#0f172a;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;display:none;z-index:30;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="demo">DEMO 6 — Datos de ejemplo inventados. Sin conexión a Firebase ni a datos reales de CAFIVER.</div>
<div class="phone" id="phone">
  <div class="top"><h1 id="ttl">Inicio</h1><div class="av" id="av" aria-hidden="true">A</div></div>
  <div class="scroll" id="main" tabindex="-1"></div>
  <nav class="tabs" aria-label="Principal">
    <button data-v="inicio" aria-current="page"><i class="ti ti-home" aria-hidden="true"></i>Inicio</button>
    <button data-v="procesos"><i class="ti ti-list-details" aria-hidden="true"></i>Procesos</button>
    <button data-v="pend"><i class="ti ti-bell" aria-hidden="true"></i>Pendientes<span class="badge" id="bg" hidden></span></button>
    <button data-v="perfil"><i class="ti ti-user-circle" aria-hidden="true"></i>Perfil</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle"></div></div>
</div>
<script>
/* ===== DATOS INVENTADOS ===== */
function addD(d){var x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
var TODAY=addD(0),NM={A:'Persona A',B:'Persona B',C:'Persona C',D:'Persona D'},RL={A:'Director de TI',C:'Responsable de proceso',D:'Técnico de TI'};
var ES={borrador:'Borrador',en_revision:'En revisión',pendiente_aprobacion:'Pendiente de aprobación',aprobado:'Aprobado',publicado:'Publicado',en_revision_periodica:'En revisión periódica',obsoleto:'Obsoleto'};
function S(d,r,t){return{d:d,r:r,t:t}}
function P(id,n,cat,resp,part,est,rev,obj,alc,pasos,esp,por){return{id:id,n:n,cat:cat,resp:resp,part:part,est:est,rev:rev,obj:obj,alc:alc,pasos:pasos||[],esp:esp||0,por:por||resp}}
var PROC=[
 P('PRO-001','Gestión de incidentes','Servicio','C',['B'],'publicado',addD(18),'[DEMO] Restablecer el servicio tras una interrupción.','[DEMO] Incidentes reportados a TI.',[S('[DEMO] Registrar el incidente','Técnico de TI','15 min'),S('[DEMO] Clasificar y priorizar','Técnico de TI','30 min')]),
 P('PRO-002','Gestión de cambios','Cambios','C',[],'pendiente_aprobacion',null,'[DEMO] Controlar cambios tecnológicos.','[DEMO] Aplicaciones e infraestructura.',[S('[DEMO] Solicitar el cambio','Solicitante','—')],6),
 P('PRO-003','Administración de licencias','Activos','C',['B'],'en_revision',null,'[DEMO] Mantener control de licencias.','[DEMO] Software del área.',[S('[DEMO] Registrar licencia','Responsable','1 día')]),
 P('PRO-004','Gestión de respaldos','Continuidad','C',[],'borrador',null,'','',[]),
 P('PRO-005','Altas y bajas de personal de TI','Accesos','C',[],'publicado',addD(-12),'[DEMO] Alta y baja ordenada de accesos.','[DEMO] Personal de TI.',[S('[DEMO] Recibir solicitud de RH','Responsable','1 día')]),
 P('PRO-006','Seguridad informática','Seguridad','C',['D'],'borrador',null,'[DEMO] Proteger los activos de TI.','',[]),
 P('PRO-007','Gestión de solicitudes','Servicio','C',['B','D'],'publicado',addD(75),'[DEMO] Atender solicitudes de servicio.','[DEMO] Solicitudes recibidas.',[S('[DEMO] Registrar solicitud','Técnico de TI','15 min')]),
 P('PRO-008','Administración de usuarios y accesos','Accesos','C',[],'en_revision_periodica',addD(-40),'[DEMO] Controlar cuentas.','[DEMO] Cuentas de TI.',[S('[DEMO] Revisar cuentas activas','Responsable','2 días')]),
 P('PRO-011','Gestión de proyectos','Proyectos','C',[],'pendiente_aprobacion',null,'[DEMO] Ordenar proyectos.','[DEMO] Proyectos de TI.',[S('[DEMO] Registrar proyecto','Responsable','1 día')],2,'A')
];
var MIN=5,META=60,cur='A',view='inicio',filt='todos',q='',ret=null,first=true;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function vig(p){return p.est==='publicado'||p.est==='en_revision_periodica'}
function venc(p){return vig(p)&&p.rev&&p.rev<TODAY}
function solo(p){return p.est!=='obsoleto'&&!p.part.length}
function completo(p){return p.obj.trim()&&p.alc.trim()&&p.pasos.length>0}
function calc(){var A=PROC.filter(function(p){return p.est!=='obsoleto'}),n=A.length,d=A.filter(function(p){return vig(p)&&completo(p)}).length;
 return{n:n,d:d,pct:n>=MIN?Math.round(d/n*100):null,pen:PROC.filter(function(p){return p.est==='pendiente_aprobacion'}).length,ven:PROC.filter(venc).length,pub:PROC.filter(vig).length,so:PROC.filter(solo).length}}
function pendientes(){ /* lo que requiere acción del rol actual */
 if(cur==='A')return PROC.filter(function(p){return p.est==='pendiente_aprobacion'||p.est==='aprobado'||venc(p)});
 if(cur==='C')return PROC.filter(function(p){return p.resp==='C'&&(p.est==='borrador'||p.est==='en_revision'||venc(p))});
 return []}
function say(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},3000)}
/* ===== PANTALLAS ===== */
function item(p){var c=venc(p)?'r':p.est==='pendiente_aprobacion'?'a':'',sc=p.est==='publicado'?'g':(p.est==='pendiente_aprobacion'||p.est==='en_revision')?'a':'n';
 return '<button class="item '+c+'" data-open="'+p.id+'"><b>'+esc(p.n)+'</b><span class="st '+sc+'">'+ES[p.est]+'</span><small>'+p.id+' · '+p.cat+(venc(p)?' · <span style="color:var(--bd);font-weight:700">Revisión vencida</span>':'')+'</small></button>'}
function vInicio(){
 var c=calc(),h='<p class="sub">Hola, '+NM[cur]+' · '+RL[cur]+'</p>';
 if(cur==='D')return h+'<div class="card"><b>Vista de técnico</b><p class="help" style="margin-top:6px;font-size:14px">Aquí consultas los procedimientos <b>publicados</b>. Ve a la pestaña Procesos para buscarlos.</p></div><div class="fab"></div>';
 var st=c.pct===null?'Muestra insuficiente':c.pct>=META?'Cumple la meta':'Bajo la meta';
 h+='<div class="hero"><div class="l">Procesos documentados<span class="st">'+st+'</span></div><div class="v">'+(c.pct===null?c.d+' de '+c.n:c.pct+'%')+'</div><div class="c">'+c.d+' de '+c.n+' procesos completos y publicados · meta '+META+'%</div>'+(c.pct!==null?'<div class="trk" role="img" aria-label="Documentados '+c.pct+' por ciento, meta '+META+' por ciento"><i style="width:'+c.pct+'%"></i><span class="meta" style="left:'+META+'%"></span></div>':'')+'</div>';
 h+='<div class="grid2"><button class="card" data-go="pen"><div class="l">Esperan aprobación</div><div class="v">'+c.pen+'</div></button><button class="card'+(c.ven?' r':'')+'" data-go="venc"><div class="l">Revisión vencida</div><div class="v">'+c.ven+'</div></button><button class="card" data-go="pub"><div class="l">Publicados</div><div class="v">'+c.pub+'</div></button><button class="card" data-go="solo"><div class="l">Dependen de una persona</div><div class="v">'+c.so+'</div></button></div>';
 var pd=pendientes();h+='<h2>'+(cur==='A'?'Requiere tu decisión':'Pendientes de seguimiento')+'</h2>'+(pd.length?pd.slice(0,3).map(item).join(''):'<p class="empty">Nada pendiente.</p>');
 return h+'<p class="help" style="margin-top:8px">Cálculo: documentado = versión publicada con objetivo, alcance y al menos una actividad. Porcentaje solo con ≥'+MIN+' procesos.</p>'}
function vProcesos(){
 var L=PROC.filter(function(p){return cur==='D'?vig(p):true});
 var F={todos:function(){return true},pub:vig,pen:function(p){return p.est==='pendiente_aprobacion'},venc:venc,solo:solo,mis:function(p){return p.resp===cur}};
 L=L.filter(F[filt]||F.todos).filter(function(p){return !q||(p.n+p.id).toLowerCase().indexOf(q.toLowerCase())>=0});
 var ch=[['todos','Todos'],['pub','Publicados'],['pen','Pendientes'],['venc','Vencidos'],['solo','Sin respaldo']];if(cur==='D')ch=[['todos','Todos']];
 var h='<div class="search"><i class="ti ti-search" aria-hidden="true"></i><input id="q" type="search" placeholder="Buscar procedimiento" aria-label="Buscar procedimiento" value="'+esc(q)+'"></div>';
 if(ch.length>1)h+='<div class="chips" role="group" aria-label="Filtros">'+ch.map(function(c){return '<button class="chip" data-f="'+c[0]+'" aria-pressed="'+(filt===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>';
 if(first){first=false;return h+'<div aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><span class="sr">Cargando…</span>'}
 h+=L.length?L.map(item).join(''):'<p class="empty">No hay procedimientos con este filtro.</p>';
 if(cur==='C')h+='<div class="fab"><button class="btn pri" id="nuevo"><i class="ti ti-plus" aria-hidden="true"></i>Nuevo</button></div>';
 return h}
function vPend(){var pd=pendientes();return '<p class="sub">'+(cur==='A'?'Elementos que requieren tu decisión.':cur==='C'?'Tus borradores y revisiones por atender.':'El técnico no tiene pendientes de aprobación.')+'</p>'+(pd.length?pd.map(item).join(''):'<p class="empty">Todo al día ✓</p>')}
function vPerfil(){return '<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:48px;height:48px;font-size:18px" aria-hidden="true">'+cur+'</div><div><b>'+NM[cur]+'</b><div class="help">'+RL[cur]+'</div></div></div></div><div class="fl"><select id="who" aria-label="Simular sesión como"><option value="A"'+(cur==='A'?' selected':'')+'>Persona A — Director de TI</option><option value="C"'+(cur==='C'?' selected':'')+'>Persona C — Responsable de proceso</option><option value="D"'+(cur==='D'?' selected':'')+'>Persona D — Técnico de TI</option></select><label for="who">Simular sesión como</label></div><p class="help">Solo para el demo: en la app real el rol viene de tu cuenta y las reglas de Firestore lo validan en el servidor.</p>'}
/* ===== HOJA INFERIOR ===== */
function openSheet(html,label){ret=document.activeElement;var s=document.getElementById('sheet');s.setAttribute('aria-label',label);s.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;document.getElementById('scrim').classList.add('on');var f=s.querySelector('.x,input,select');if(f)f.focus();s.querySelectorAll('.x,[data-close]').forEach(function(b){b.onclick=closeSheet})}
function closeSheet(){document.getElementById('scrim').classList.remove('on');if(ret&&document.contains(ret))ret.focus();ret=null}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();
 if(e.key==='Tab'&&document.getElementById('scrim').classList.contains('on')){var f=[].slice.call(document.querySelectorAll('#sheet button:not([disabled]),#sheet input,#sheet select,#sheet textarea')),a=document.activeElement;if(!f.length)return;if(e.shiftKey&&a===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&a===f[f.length-1]){e.preventDefault();f[0].focus()}}});
document.getElementById('scrim').onclick=function(e){if(e.target===this)closeSheet()};
function openP(id){
 var p=PROC.filter(function(x){return x.id===id})[0],dir=cur==='A',seg=p.por===cur,cta='',note='';
 if(p.est==='borrador'&&cur==='C'&&p.resp==='C'){cta='<button class="btn pri full" data-do="enviar">Enviar a revisión</button>'}
 else if(p.est==='en_revision'&&cur==='C'&&p.resp==='C'){cta='<button class="btn pri full" data-do="solicitar">Solicitar aprobación</button>'}
 else if(p.est==='pendiente_aprobacion'){cta='<button class="btn pri full" data-do="aprobar" '+(dir&&!seg?'':'aria-disabled="true"')+'>Aprobar</button><button class="btn full" data-do="rechazar" '+(dir?'':'aria-disabled="true"')+'>Rechazar con motivo</button>';note=!dir?'Solo el Director de TI aprueba.':seg?'Segregación de funciones: no puedes aprobar lo que tú enviaste.':''}
 else if(p.est==='aprobado'){cta='<button class="btn pri full" data-do="publicar" '+(dir?'':'aria-disabled="true"')+'>Publicar</button>';note=dir?'':'Solo el Director de TI publica.'}
 var sc=p.est==='publicado'?'g':(p.est==='pendiente_aprobacion'||p.est==='en_revision')?'a':'n';
 var h='<div class="sh"><h3>'+esc(p.n)+'</h3><button class="x" aria-label="Cerrar"><i class="ti ti-x" aria-hidden="true"></i></button></div><div class="sb"><p style="margin-bottom:10px"><span class="st '+sc+'">'+ES[p.est]+'</span> <span class="help">'+p.id+'</span></p><dl><dt>Responsable</dt><dd>'+NM[p.resp]+'</dd><dt>Participantes</dt><dd>'+(p.part.length?p.part.map(function(x){return NM[x]}).join(', '):'<b style="color:var(--wn)">Ninguno: depende de una persona</b>')+'</dd><dt>Próx. revisión</dt><dd>'+(p.rev||'—')+'</dd><dt>Objetivo</dt><dd>'+(p.obj?esc(p.obj):'<span class="help">Sin registrar</span>')+'</dd><dt>Alcance</dt><dd>'+(p.alc?esc(p.alc):'<span class="help">Sin registrar</span>')+'</dd></dl><b>Actividades ('+p.pasos.length+')</b>'+(p.pasos.length?p.pasos.map(function(s,i){return '<div class="step"><i>'+(i+1)+'</i><div>'+esc(s.d)+'<small>'+esc(s.r)+' · '+esc(s.t)+'</small></div></div>'}).join(''):'<p class="help" style="margin-top:6px">Aún sin actividades registradas.</p>')+'</div><div class="sf">'+(note?'<p class="help" role="status" style="text-align:center">'+note+'</p>':'')+(cta||'<button class="btn full" data-close>Cerrar</button>')+'</div>';
 openSheet(h,p.id+' '+p.n);
 document.querySelectorAll('#sheet [data-do]').forEach(function(b){b.onclick=function(){
  if(b.getAttribute('aria-disabled')){say('No disponible con tu rol o por segregación de funciones');return}
  var d=b.dataset.do;
  if(d==='enviar'){if(!completo(p)){say('Falta objetivo, alcance o al menos una actividad. Completa el borrador antes de enviar.');return}p.est='en_revision';say(p.id+' enviado a revisión')}
  if(d==='solicitar'){p.est='pendiente_aprobacion';p.por=cur;p.esp=0;say(p.id+' enviado a aprobación')}
  if(d==='aprobar'){p.est='aprobado';say(p.id+' aprobado. Falta publicarlo.')}
  if(d==='rechazar'){var m=prompt('Motivo del rechazo (obligatorio):');if(!m){say('El motivo es obligatorio. No se aplicó.');return}p.est='borrador';say(p.id+' devuelto a borrador')}
  if(d==='publicar'){p.est='publicado';p.rev=addD(365);say(p.id+' publicado')}
  closeSheet();render()}})}
function nuevo(){
 openSheet('<div class="sh"><h3>Nuevo procedimiento</h3><button class="x" aria-label="Cerrar"><i class="ti ti-x" aria-hidden="true"></i></button></div><div class="sb"><div class="fl" id="g1"><input id="n1" placeholder=" " autocomplete="off"><label for="n1">Nombre del proceso *</label><div class="err" id="e1" role="alert"></div></div><div class="fl"><select id="n2"><option>Servicio</option><option>Cambios</option><option>Activos</option><option>Accesos</option><option>Seguridad</option><option>Continuidad</option></select><label for="n2">Categoría</label></div><div class="fl" id="g3"><textarea id="n3" placeholder=" "></textarea><label for="n3">Objetivo (puedes completarlo después)</label></div><p class="help">Se crea como <b>Borrador</b> con tu usuario como responsable. No se inventan pasos ni controles.</p></div><div class="sf"><button class="btn pri full" id="crear">Crear borrador</button></div>','Nuevo procedimiento');
 document.getElementById('n1').oninput=function(){document.getElementById('g1').classList.remove('bad');document.getElementById('e1').textContent=''};
 document.getElementById('crear').onclick=function(){var n=document.getElementById('n1').value.trim(),g=document.getElementById('g1'),e=document.getElementById('e1');
  if(!n){g.classList.add('bad');e.textContent='Escribe el nombre del proceso.';document.getElementById('n1').focus();return}
  var id='PRO-'+('00'+(PROC.length+4)).slice(-3);PROC.push(P(id,n,document.getElementById('n2').value,cur,[],'borrador',null,document.getElementById('n3').value,'',[]));
  closeSheet();say(id+' creado como borrador');filt='todos';view='procesos';render()}}
/* ===== ARRANQUE ===== */
var TTL={inicio:'Inicio',procesos:'Procesos',pend:'Pendientes',perfil:'Perfil'};
function render(){
 document.getElementById('ttl').textContent=TTL[view];document.getElementById('av').textContent=cur;
 document.querySelectorAll('.tabs button').forEach(function(b){if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 var n=pendientes().length,bg=document.getElementById('bg');bg.hidden=!n;bg.textContent=n;
 document.getElementById('main').innerHTML=({inicio:vInicio,procesos:vProcesos,pend:vPend,perfil:vPerfil})[view]();
 document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openP(b.dataset.open)}});
 document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){filt=b.dataset.go;view='procesos';render()}});
 document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filt=b.dataset.f;render()}});
 var qi=document.getElementById('q');if(qi)qi.oninput=function(){q=this.value;var pos=this.selectionStart;render();var n2=document.getElementById('q');n2.focus();n2.setSelectionRange(pos,pos)};
 var nu=document.getElementById('nuevo');if(nu)nu.onclick=nuevo;
 var w=document.getElementById('who');if(w)w.onchange=function(){cur=this.value;filt='todos';render()};
 if(view==='procesos'&&document.querySelector('.sk'))setTimeout(render,600);
}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){view=b.dataset.v;if(view==='procesos')filt=filt;render()}});
render();
</script>
