<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFIVER TI — DEMO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1c1e21;--mut:#6b7280;--line:#e8eaed;--blue:#1a73e8;--side:#0f172a;
--ok:#2e7d32;--okbg:#e6f4ea;--warn:#b45309;--warnbg:#fff8e1;--bad:#c62828;--badbg:#fce8e6;--gray:#5f6368;--graybg:#f0f2f5;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;display:flex;min-height:100vh}
.demo-banner{position:fixed;top:0;left:0;right:0;z-index:50;background:#7c2d12;color:#fff;text-align:center;font-size:12px;font-weight:600;padding:6px 10px}
aside{width:224px;background:var(--side);color:#cbd5e1;padding:44px 0 12px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{padding:0 16px 14px;font-weight:700;color:#fff;font-size:15px}.logo small{display:block;font-weight:400;font-size:10px;color:#64748b}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#475569;padding:12px 16px 4px}
.nav{display:flex;gap:9px;align-items:center;padding:8px 16px;cursor:pointer;color:#94a3b8;border:0;background:none;width:100%;text-align:left;font:inherit;font-size:12px}
.nav:hover{color:#e2e8f0}.nav.on{color:#fff;background:rgba(129,140,248,.15);box-shadow:inset 3px 0 #818cf8}
.nav.off{opacity:.45;cursor:not-allowed}
.nav small{margin-left:auto;font-size:8px;background:#334155;border-radius:9px;padding:1px 6px}
.roleBox{margin:auto 12px 0;padding:10px;background:rgba(255,255,255,.06);border-radius:10px}
.roleBox label{font-size:10px;color:#94a3b8;display:block;margin-bottom:5px}
select,input,textarea{font:inherit;font-size:12px;padding:6px 9px;border:1.5px solid #e0e2e6;border-radius:8px;background:#fff;color:var(--ink);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
main{flex:1;padding:50px 24px 24px;min-width:0}
h1{font-size:19px;margin-bottom:3px}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi{cursor:pointer;transition:.15s}.kpi:hover{border-color:var(--blue);transform:translateY(-1px)}
.kpi .v{font-size:26px;font-weight:700}.kpi .l{font-size:11px;color:var(--mut)}.kpi .d{font-size:10px;color:#9aa0a6;margin-top:4px}
.kpi.act{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.na,.kpi .v.na{color:#9aa0a6;font-size:14px;font-weight:500;line-height:1.5;padding-top:4px}
.pill{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.p-borrador{background:var(--graybg);color:var(--gray)}.p-en_revision{background:#e8f0fe;color:var(--blue)}
.p-pendiente_aprobacion{background:var(--warnbg);color:var(--warn)}.p-aprobado{background:#e0f2f1;color:#00695c}
.p-publicado{background:var(--okbg);color:var(--ok)}.p-en_revision_periodica{background:#f3e8fd;color:#7b1fa2}.p-obsoleto{background:var(--badbg);color:var(--bad)}
table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:9px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top}tr.r{cursor:pointer}tr.r:hover td{background:#f8fafc}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px;align-items:center}
.btn{display:inline-flex;gap:5px;align-items:center;padding:6px 13px;border-radius:8px;border:1px solid #dde1e7;background:#fff;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{background:#f0f2f5}.btn.pri{background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff;border-color:transparent}
.btn.no{background:#fafafa;color:#b0b4ba;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:flex-start;justify-content:center;padding:50px 16px 16px;overflow:auto;z-index:60}
.modal.on{display:flex}.mc{background:#fff;border-radius:16px;width:100%;max-width:880px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.mh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:15px}
.mb{padding:14px 20px 20px}.mf{padding:12px 20px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 16px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:500}.tab.on{color:var(--blue);border-color:var(--blue)}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}dt{color:var(--mut);font-size:11px;font-weight:600}dd{white-space:pre-wrap}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6}.step b.n{background:var(--blue);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px}
.step small{color:var(--mut);display:block}
.flow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}.flow span{font-size:10px;padding:3px 8px;border-radius:12px;background:var(--graybg);color:var(--gray)}.flow span.cur{background:var(--blue);color:#fff;font-weight:600}.flow span.done{background:var(--okbg);color:var(--ok)}
.note{background:var(--warnbg);border:1px solid #fde68a;color:#78350f;border-radius:10px;padding:9px 12px;font-size:12px;margin:8px 0}
.note.err{background:var(--badbg);border-color:#fecaca;color:#7f1d1d}.note.ok{background:var(--okbg);border-color:#bbf7d0;color:#14532d}
.empty{text-align:center;color:#9aa0a6;padding:22px}
.pg{height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;margin-top:5px}.pg i{display:block;height:100%;background:var(--blue)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;padding:5px 0}.tl div:before{content:"";position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl small{color:var(--mut)}
.chk label{display:flex;gap:6px;align-items:center;padding:3px 0}
@media(max-width:800px){aside{display:none}main{padding:50px 12px}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demo-banner">DEMO — Datos de ejemplo inventados. No hay conexión a Firebase ni a datos reales de CAFIVER.</div>

<aside>
  <div class="logo">Cafiver TI<small>Centro de Gestión de Tecnología</small></div>
  <div class="sec">Principal</div>
  <button class="nav on" data-v="inicio"><i class="ti ti-layout-dashboard"></i>Inicio</button>
  <button class="nav" data-v="procesos"><i class="ti ti-sitemap"></i>Procesos y procedimientos</button>
  <button class="nav" data-v="inventario"><i class="ti ti-server"></i>Inventario <small>existente</small></button>
  <div class="sec">Fases posteriores</div>
  <button class="nav off" title="Se construye en una fase posterior"><i class="ti ti-headset"></i>Mesa de ayuda <small>pendiente</small></button>
  <button class="nav off"><i class="ti ti-git-pull-request"></i>Gestión de cambios <small>pendiente</small></button>
  <button class="nav off"><i class="ti ti-checklist"></i>Proyectos de TI <small>pendiente</small></button>
  <button class="nav off"><i class="ti ti-file-certificate"></i>Proveedores y contratos <small>pendiente</small></button>
  <button class="nav off"><i class="ti ti-database-export"></i>Respaldos y continuidad <small>pendiente</small></button>
  <div class="sec">Administración</div>
  <button class="nav" data-v="usuarios"><i class="ti ti-users"></i>Usuarios y roles</button>
  <button class="nav" data-v="auditoria"><i class="ti ti-history"></i>Auditoría</button>
  <div class="roleBox">
    <label>Simular sesión como:</label>
    <select id="who" style="width:100%"></select>
    <div id="whoRoles" style="font-size:10px;color:#94a3b8;margin-top:6px"></div>
  </div>
</aside>

<main id="main"></main>

<div class="modal" id="modal"><div class="mc" id="mc"></div></div>

<script>
/* ===== DATOS DE EJEMPLO (INVENTADOS) ===== */
var USERS=[
 {email:'persona.a@demo.local',nombre:'Persona Demo A',roles:['director']},
 {email:'persona.b@demo.local',nombre:'Persona Demo B',roles:['administrador']},
 {email:'persona.c@demo.local',nombre:'Persona Demo C',roles:['resp_proceso']},
 {email:'persona.d@demo.local',nombre:'Persona Demo D',roles:['tecnico']},
 {email:'persona.e@demo.local',nombre:'Persona Demo E',roles:['solicitante']}
];
var ROLES={
 director:{n:'Director de TI',p:['ver_todo','aprobar','publicar','indicadores']},
 administrador:{n:'Administrador de la plataforma',p:['ver_todo','editar_todo','publicar','admin','crear']},
 resp_proceso:{n:'Responsable de proceso',p:['ver_todo','editar_propios','crear']},
 tecnico:{n:'Técnico de TI',p:['ver_publicados']},
 solicitante:{n:'Solicitante',p:[]}
};
var TODAY=new Date().toISOString().slice(0,10);
function addD(d){var x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
var PROC=[
 {id:'PRO-001',nombre:'Gestión de incidentes',cat:'Servicio',resp:'persona.c@demo.local',part:['persona.d@demo.local'],estado:'publicado',vt:1,vp:1,rev:addD(18),
  versiones:[{n:1,estado:'publicado',creadoPor:'persona.c@demo.local',editores:['persona.c@demo.local'],aprob:{por:'persona.a@demo.local',en:addD(-300)},
   c:{objetivo:'[DEMO] Restablecer el servicio lo antes posible tras una interrupción.',alcance:'[DEMO] Incidentes reportados a TI.',
   riesgos:['[DEMO] Incidente sin dueño asignado'],controles:['[DEMO] Todo ticket tiene responsable'],
   pasos:[{d:'[DEMO] Registrar el incidente',r:'Técnico de TI',s:'Mesa de ayuda',e:'Reporte del usuario',res:'Ticket creado',ev:'Folio',t:'15 min',x:'—'},
          {d:'[DEMO] Clasificar y priorizar',r:'Técnico de TI',s:'Mesa de ayuda',e:'Ticket',res:'Prioridad asignada',ev:'Ticket actualizado',t:'30 min',x:'Incidente crítico: escalar'}]}}]},
 {id:'PRO-002',nombre:'Gestión de cambios',cat:'Cambios',resp:'persona.c@demo.local',part:[],estado:'pendiente_aprobacion',vt:1,vp:null,rev:null,
  versiones:[{n:1,estado:'pendiente_aprobacion',creadoPor:'persona.c@demo.local',editores:['persona.c@demo.local'],
   c:{objetivo:'[DEMO] Controlar cambios tecnológicos.',alcance:'[DEMO] Aplicaciones e infraestructura.',riesgos:[],controles:[],
   pasos:[{d:'[DEMO] Solicitar el cambio',r:'Solicitante',s:'—',e:'Solicitud',res:'Folio',ev:'Formato',t:'—',x:'—'}]}}]},
 {id:'PRO-003',nombre:'Administración de licencias',cat:'Activos',resp:'persona.c@demo.local',part:['persona.d@demo.local'],estado:'en_revision',vt:1,vp:null,rev:null,
  versiones:[{n:1,estado:'en_revision',creadoPor:'persona.c@demo.local',editores:['persona.c@demo.local'],c:{objetivo:'[DEMO] Mantener control de licencias.',alcance:'',riesgos:[],controles:[],pasos:[]}}]},
 {id:'PRO-004',nombre:'Gestión de respaldos',cat:'Continuidad',resp:'persona.d@demo.local',part:[],estado:'borrador',vt:1,vp:null,rev:null,
  versiones:[{n:1,estado:'borrador',creadoPor:'persona.d@demo.local',editores:['persona.d@demo.local'],c:{objetivo:'',alcance:'',riesgos:[],controles:[],pasos:[]}}]},
 {id:'PRO-005',nombre:'Altas y bajas de personal de TI',cat:'Accesos',resp:'persona.c@demo.local',part:[],estado:'publicado',vt:1,vp:1,rev:addD(-12),
  versiones:[{n:1,estado:'publicado',creadoPor:'persona.c@demo.local',editores:['persona.c@demo.local'],aprob:{por:'persona.a@demo.local',en:addD(-400)},
   c:{objetivo:'[DEMO] Alta y baja ordenada de accesos.',alcance:'[DEMO] Personal de TI.',riesgos:[],controles:[],pasos:[{d:'[DEMO] Recibir solicitud de RH',r:'Resp. de proceso',s:'—',e:'Solicitud',res:'Cuenta solicitada',ev:'Correo',t:'1 día',x:'—'}]}}]},
 {id:'PRO-006',nombre:'Seguridad informática',cat:'Seguridad',resp:'persona.c@demo.local',part:['persona.d@demo.local'],estado:'borrador',vt:1,vp:null,rev:null,
  versiones:[{n:1,estado:'borrador',creadoPor:'persona.c@demo.local',editores:['persona.c@demo.local'],c:{objetivo:'',alcance:'',riesgos:[],controles:[],pasos:[]}}]}
];
var AUD=[];
var cur=USERS[0],view='inicio',filtro={q:'',estado:'',kpi:''};
var ESTADOS={borrador:'Borrador',en_revision:'En revisión',pendiente_aprobacion:'Pendiente de aprobación',aprobado:'Aprobado',publicado:'Publicado',en_revision_periodica:'En revisión periódica',obsoleto:'Obsoleto'};
var FLUJO=['borrador','en_revision','pendiente_aprobacion','aprobado','publicado','en_revision_periodica','obsoleto'];

/* ===== PERMISOS ===== */
function has(p){return cur.roles.some(function(r){return ROLES[r].p.indexOf(p)>=0})}
function userName(e){var u=USERS.filter(function(x){return x.email===e})[0];return u?u.nombre:e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function puedeEditar(p){return has('editar_todo')||(has('editar_propios')&&(p.resp===cur.email||p.part.indexOf(cur.email)>=0))}
function visibles(){
  if(has('ver_todo'))return PROC;
  if(has('ver_publicados'))return PROC.filter(function(p){return p.vp});
  return [];
}
/* Acciones permitidas para la versión de trabajo -> [{id,label,ok,why}] */
function acciones(p){
  var v=p.versiones[p.versiones.length-1],e=v.estado,out=[];
  function add(id,label,perm,extra){var ok=perm,why='';if(!perm)why='Tu rol no tiene permiso para esta acción.';
    if(perm&&extra){ok=false;why=extra}out.push({id:id,label:label,ok:ok,why:why})}
  var ed=puedeEditar(p),ap=has('aprobar'),pu=has('publicar');
  if(e==='borrador')add('enviar','Enviar a revisión',ed);
  if(e==='en_revision'){add('solicitar','Solicitar aprobación',ed);add('devolver','Devolver a borrador',ed)}
  if(e==='pendiente_aprobacion'){
    var seg=v.editores.indexOf(cur.email)>=0?'Segregación de funciones: quien editó la versión no puede aprobarla.':'';
    add('aprobar','Aprobar',ap,seg);add('rechazar','Rechazar (con motivo)',ap)}
  if(e==='aprobado')add('publicar','Publicar',pu);
  if(e==='publicado'){add('revisar','Iniciar revisión periódica',ed);add('nueva','Crear nueva versión',ed)}
  if(e==='en_revision_periodica'){add('ratificar','Ratificar vigencia',pu);add('nueva','Crear nueva versión',ed)}
  if(['aprobado','publicado','en_revision_periodica'].indexOf(e)>=0)add('obsoleto','Marcar obsoleto (con motivo)',pu);
  return out;
}
function log(p,accion,det){AUD.unshift({f:new Date().toLocaleString('es-MX'),u:cur.email,a:accion,r:p?p.id:'—',d:det||''})}
function aplicar(p,id){
  var v=p.versiones[p.versiones.length-1],motivo='';
  if(id==='rechazar'||id==='obsoleto'){motivo=prompt('Motivo (obligatorio):');if(!motivo){alert('El motivo es obligatorio. No se aplicó la acción.');return}}
  var map={enviar:'en_revision',solicitar:'pendiente_aprobacion',devolver:'borrador',rechazar:'borrador',aprobar:'aprobado',publicar:'publicado',revisar:'en_revision_periodica',ratificar:'publicado',obsoleto:'obsoleto'};
  if(id==='nueva'){
    var nv=JSON.parse(JSON.stringify(v));nv.n=v.n+1;nv.estado='borrador';nv.creadoPor=cur.email;nv.editores=[cur.email];delete nv.aprob;
    p.versiones.push(nv);p.vt=nv.n;p.estado='borrador';log(p,'nueva_version','v'+nv.n+' creada; v'+v.n+' se conserva');
  }else{
    v.estado=map[id];
    if(id==='aprobar')v.aprob={por:cur.email,en:TODAY};
    if(id==='publicar'){
      p.versiones.forEach(function(x){if(x!==v&&x.estado==='publicado')x.estado='reemplazada'});
      p.vp=v.n;var d=new Date();d.setMonth(d.getMonth()+12);p.rev=d.toISOString().slice(0,10)}
    if(id==='ratificar'){var d2=new Date();d2.setMonth(d2.getMonth()+12);p.rev=d2.toISOString().slice(0,10)}
    if(id==='obsoleto'){p.vp=null;p.rev=null}
    p.estado=v.estado;log(p,id,(motivo?'Motivo: '+motivo:'')+' → '+ESTADOS[v.estado]);
  }
  openProc(p.id);render();
}
/* ===== INDICADORES (fórmulas documentadas) ===== */
var MIN=5;
function documentado(p){
  if(!p.vp)return false;var v=p.versiones.filter(function(x){return x.n===p.vp})[0];
  return !!(v&&v.c.objetivo&&v.c.alcance&&p.resp&&v.c.pasos.length>0);
}
function kpis(){
  var L=visibles(),n=L.length,doc=L.filter(documentado).length;
  return [
   {k:'reg',l:'Procesos registrados',v:n,d:'Fórmula: total de procesos no obsoletos.',f:function(p){return p.estado!=='obsoleto'}},
   {k:'doc',l:'Procesos documentados',v:n>=MIN?Math.round(doc/n*100)+'%':doc+' de '+n,d:'Versión publicada con objetivo, alcance, responsable y ≥1 paso. '+(n>=MIN?'':'Porcentaje oculto: se requieren ≥'+MIN+' registros.'),f:documentado},
   {k:'rev',l:'En revisión',v:L.filter(function(p){return p.estado==='en_revision'}).length,d:'Estado = En revisión.',f:function(p){return p.estado==='en_revision'}},
   {k:'pen',l:'Pendientes de aprobación',v:L.filter(function(p){return p.estado==='pendiente_aprobacion'}).length,d:'Estado = Pendiente de aprobación.',f:function(p){return p.estado==='pendiente_aprobacion'}},
   {k:'pub',l:'Publicados',v:L.filter(function(p){return p.vp}).length,d:'Con versión publicada vigente.',f:function(p){return !!p.vp}},
   {k:'prox',l:'Próximos a revisión (30 d)',v:L.filter(prox).length,d:'Publicados con próxima revisión en ≤30 días.',f:prox},
   {k:'venc',l:'Revisión vencida',v:L.filter(venc).length,d:'Publicados con fecha de revisión anterior a hoy.',f:venc},
   {k:'solo',l:'Dependen de una persona',v:L.filter(function(p){return !p.part.length&&p.estado!=='obsoleto'}).length,d:'Procesos sin participantes registrados.',f:function(p){return !p.part.length&&p.estado!=='obsoleto'}}
  ];
}
function prox(p){return p.vp&&p.rev&&p.rev>=TODAY&&p.rev<=addD(30)}
function venc(p){return p.vp&&p.rev&&p.rev<TODAY}

/* ===== VISTAS ===== */
function pill(e){return '<span class="pill p-'+e+'">'+ESTADOS[e]+'</span>'}
function render(){
  document.getElementById('whoRoles').textContent=cur.roles.map(function(r){return ROLES[r].n}).join(', ');
  document.querySelectorAll('.nav[data-v]').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  var m=document.getElementById('main');
  m.innerHTML=({inicio:vInicio,procesos:vProcesos,inventario:vInv,usuarios:vUsuarios,auditoria:vAud})[view]();
  bind();
}
function vInicio(){
  var K=kpis().slice(0,4),L=visibles();
  var h='<h1>Inicio — Dashboard ejecutivo</h1><div class="sub">Solo se muestran indicadores de módulos que ya existen. Los demás aparecen como "no disponible" hasta construirse.</div>';
  if(!has('ver_todo')&&!has('ver_publicados'))return h+'<div class="note err">Tu rol (Solicitante) no tiene acceso a indicadores de procesos. En la app real verías solo tus propios tickets (módulo futuro).</div>';
  h+='<h3 style="margin:6px 0 8px">Procesos <small style="color:#9aa0a6;font-weight:400">(datos de ejemplo)</small></h3><div class="grid g4">';
  K.forEach(function(k){h+='<div class="card kpi" data-go="'+k.k+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div><div class="d">'+k.d+'</div></div>'});
  h+='</div><div class="note ok" style="margin-top:10px">Haz clic en una tarjeta para ir a los registros que la componen.</div>';
  h+='<h3 style="margin:16px 0 8px">Inventario <small style="color:#9aa0a6;font-weight:400">(en la app real: lectura de tus colecciones actuales)</small></h3>'+
     '<div class="grid g4"><div class="card kpi"><div class="l">Total de equipos</div><div class="v na">se conecta a datos reales</div></div>'+
     '<div class="card kpi"><div class="l">En reparación</div><div class="v na">se conecta a datos reales</div></div>'+
     '<div class="card kpi"><div class="l">Garantías por vencer</div><div class="v na">se conecta a datos reales</div></div></div>';
  h+='<h3 style="margin:16px 0 8px">Módulos aún no construidos</h3><div class="grid g4">';
  ['Tickets abiertos','Cumplimiento de SLA','Cambios pendientes','Proyectos retrasados','Contratos por vencer','Respaldos con fallas'].forEach(function(x){
    h+='<div class="card"><div class="l" style="color:#6b7280">'+x+'</div><div class="v na">No disponible</div><div class="d" style="font-size:10px;color:#9aa0a6">Módulo en fase posterior. No se muestran cifras inventadas.</div></div>'});
  return h+'</div>';
}
function vProcesos(){
  var L=visibles(),K=kpis();
  if(!has('ver_todo')&&!has('ver_publicados'))return '<h1>Procesos y procedimientos</h1><div class="note err">Sin acceso con tu rol.</div>';
  var h='<h1>Procesos y procedimientos</h1><div class="sub">'+(has('ver_todo')?'Vista completa.':'Como Técnico de TI solo ves procedimientos publicados.')+'</div><div class="grid g4">';
  K.forEach(function(k){h+='<div class="card kpi'+(filtro.kpi===k.k?' act':'')+'" data-f="'+k.k+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div></div>'});
  h+='</div><div class="bar"><input id="q" placeholder="Buscar por nombre, código o categoría" style="min-width:260px" value="'+esc(filtro.q)+'"><select id="fe"><option value="">Todos los estados</option>'+
     FLUJO.map(function(e){return '<option value="'+e+'"'+(filtro.estado===e?' selected':'')+'>'+ESTADOS[e]+'</option>'}).join('')+'</select>'+
     (filtro.kpi?'<button class="btn" id="clr">Quitar filtro de tarjeta ✕</button>':'')+
     '<span style="flex:1"></span>'+
     (has('crear')?'<button class="btn pri" id="nuevo"><i class="ti ti-plus"></i>Nuevo proceso</button><button class="btn" id="cat"><i class="ti ti-list"></i>Cargar catálogo inicial (21 borradores vacíos)</button>':'<button class="btn no" title="Tu rol no puede crear procesos">Nuevo proceso</button>')+'</div>';
  var kf=K.filter(function(k){return k.k===filtro.kpi})[0],q=filtro.q.toLowerCase();
  var rows=L.filter(function(p){return (!kf||kf.f(p))&&(!filtro.estado||p.estado===filtro.estado)&&(!q||(p.nombre+p.id+p.cat).toLowerCase().indexOf(q)>=0)});
  h+='<div class="card" style="padding:0;overflow:auto"><table><tr><th>Código</th><th>Proceso</th><th>Categoría</th><th>Responsable</th><th>Estado</th><th>Versión</th><th>Próx. revisión</th></tr>';
  if(!rows.length)h+='<tr><td colspan="7" class="empty">No hay procesos con estos filtros.</td></tr>';
  rows.forEach(function(p){
    var rv=p.rev?(venc(p)?'<span style="color:var(--bad);font-weight:600">'+p.rev+' · vencida</span>':p.rev):'—';
    h+='<tr class="r" data-id="'+p.id+'"><td>'+p.id+'</td><td><b>'+esc(p.nombre)+'</b></td><td>'+esc(p.cat)+'</td><td>'+esc(userName(p.resp))+'</td><td>'+pill(p.estado)+
       '</td><td>v'+p.vt+(p.vp&&p.vp!==p.vt?' <small style="color:#9aa0a6">(vigente v'+p.vp+')</small>':'')+'</td><td>'+rv+'</td></tr>'});
  return h+'</table></div>';
}
function vInv(){return '<h1>Inventario de equipos</h1><div class="sub">Este módulo ya existe en tu app y <b>no se reconstruye</b>.</div><div class="card"><p>En la app real esta opción abre tu inventario actual sin cambios (equipos, QR, reparaciones, celulares, licencias, personal, obsoletos y etiquetas).</p><p style="margin-top:8px">Lo nuevo será que tickets, cambios y proyectos <b>apunten al ID del equipo</b> (por ejemplo <code>EQ…</code>), sin copiar sus datos.</p></div>'}
function vUsuarios(){
  if(!has('admin'))return '<h1>Usuarios y roles</h1><div class="note err">Solo el Administrador de la plataforma puede gestionar roles. (En la app real, esto también lo bloquean las reglas de Firestore, no solo la interfaz.)</div>';
  var h='<h1>Usuarios y roles</h1><div class="sub">Cada usuario puede tener uno o varios roles. Los cambios quedan en la auditoría.</div><div class="card" style="padding:0"><table><tr><th>Usuario</th><th>Roles</th><th></th></tr>';
  USERS.forEach(function(u,i){h+='<tr><td><b>'+esc(u.nombre)+'</b><br><small style="color:#9aa0a6">'+esc(u.email)+'</small></td><td>'+u.roles.map(function(r){return '<span class="pill p-en_revision" style="margin-right:4px">'+ROLES[r].n+'</span>'}).join('')+'</td><td><button class="btn" data-ed="'+i+'">Cambiar roles</button></td></tr>'});
  h+='</table></div><h3 style="margin:16px 0 8px">Qué puede hacer cada rol (en procesos)</h3><div class="card" style="padding:0"><table><tr><th>Rol</th><th>Alcance</th></tr>'+
  '<tr><td>Director de TI</td><td>Ve todo · aprueba procedimientos (no los que él editó) · publica · ve indicadores y auditoría</td></tr>'+
  '<tr><td>Administrador</td><td>Ve y edita todo · crea procesos · publica · gestiona roles y catálogos</td></tr>'+
  '<tr><td>Responsable de proceso</td><td>Crea y edita solo sus procesos · envía a revisión y a aprobación</td></tr>'+
  '<tr><td>Técnico de TI</td><td>Consulta solo procedimientos publicados</td></tr>'+
  '<tr><td>Solicitante</td><td>Sin acceso a procesos · en el futuro: crear y seguir sus tickets</td></tr></table></div>';
  return h;
}
function vAud(){
  if(!has('admin')&&!has('indicadores'))return '<h1>Auditoría</h1><div class="note err">Solo Director de TI y Administrador consultan la auditoría.</div>';
  var h='<h1>Auditoría</h1><div class="sub">Bitácora de solo lectura: nadie puede editar ni borrar registros.</div><div class="card" style="padding:0"><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Registro</th><th>Detalle</th></tr>';
  if(!AUD.length)h+='<tr><td colspan="5" class="empty">Aún no hay eventos. Prueba aprobar o publicar un procedimiento en "Procesos".</td></tr>';
  AUD.forEach(function(a){h+='<tr><td>'+a.f+'</td><td>'+esc(a.u)+'</td><td>'+esc(a.a)+'</td><td>'+esc(a.r)+'</td><td>'+esc(a.d)+'</td></tr>'});
  return h+'</table></div>';
}
/* ===== DETALLE ===== */
function openProc(id,tab){
  var p=PROC.filter(function(x){return x.id===id})[0],v=p.versiones[p.versiones.length-1];tab=tab||'ficha';
  var idx=FLUJO.indexOf(v.estado);
  var h='<div class="mh"><div><h3>'+p.id+' · '+esc(p.nombre)+'</h3><div style="margin-top:3px">'+pill(p.estado)+' <small style="color:#6b7280">versión de trabajo v'+p.vt+(p.vp?' · vigente v'+p.vp:' · sin versión vigente')+'</small></div></div><button class="btn" onclick="closeM()">✕</button></div><div class="mb">';
  h+='<div class="flow">'+FLUJO.map(function(e,i){return '<span class="'+(i<idx?'done':i===idx?'cur':'')+'">'+ESTADOS[e]+'</span>'}).join('')+'</div>';
  h+='<div class="tabs">'+[['ficha','Ficha'],['pasos','Pasos ('+v.c.pasos.length+')'],['vers','Versiones ('+p.versiones.length+')'],['hist','Historial']].map(function(t){return '<div class="tab'+(tab===t[0]?' on':'')+'" onclick="openProc(\''+id+'\',\''+t[0]+'\')">'+t[1]+'</div>'}).join('')+'</div>';
  function list(a){return a&&a.length?a.map(function(x){return '• '+esc(x)}).join('\n'):'<span style="color:#9aa0a6">Sin registrar</span>'}
  function val(x){return x?esc(x):'<span style="color:#9aa0a6">Sin registrar</span>'}
  if(tab==='ficha')h+='<dl><dt>Categoría</dt><dd>'+esc(p.cat)+'</dd><dt>Responsable</dt><dd>'+esc(userName(p.resp))+'</dd><dt>Participantes</dt><dd>'+(p.part.length?p.part.map(userName).join(', '):'<span style="color:var(--bad)">Ninguno — el proceso depende de una sola persona</span>')+'</dd>'+
    '<dt>Objetivo</dt><dd>'+val(v.c.objetivo)+'</dd><dt>Alcance</dt><dd>'+val(v.c.alcance)+'</dd><dt>Riesgos</dt><dd>'+list(v.c.riesgos)+'</dd><dt>Controles</dt><dd>'+list(v.c.controles)+'</dd><dt>Próxima revisión</dt><dd>'+(p.rev||'—')+'</dd><dt>Aprobación</dt><dd>'+(v.aprob?'Aprobó '+esc(userName(v.aprob.por))+' el '+v.aprob.en:'Sin aprobación registrada')+'</dd></dl>';
  if(tab==='pasos'){if(!v.c.pasos.length)h+='<div class="empty">Esta versión aún no tiene actividades registradas.</div>';
    v.c.pasos.forEach(function(s,i){h+='<div class="step"><b class="n">'+(i+1)+'</b><div><b>'+esc(s.d)+'</b><small>Responsable: '+esc(s.r)+' · Sistema: '+esc(s.s)+' · Tiempo objetivo: '+esc(s.t)+'</small><small>Entrada: '+esc(s.e)+' → Resultado: '+esc(s.res)+'</small><small>Evidencia: '+esc(s.ev)+' · Excepciones: '+esc(s.x)+'</small></div></div>'})}
  if(tab==='vers')h+='<table><tr><th>Versión</th><th>Estado</th><th>Creada por</th><th>Aprobada por</th></tr>'+p.versiones.slice().reverse().map(function(x){return '<tr><td>v'+x.n+'</td><td>'+(ESTADOS[x.estado]?pill(x.estado):'<span class="pill p-obsoleto">Reemplazada</span>')+'</td><td>'+esc(userName(x.creadoPor))+'</td><td>'+(x.aprob?esc(userName(x.aprob.por)):'—')+'</td></tr>'}).join('')+'</table><div class="note">Las versiones aprobadas o publicadas no se pueden modificar: un cambio crea una versión nueva y conserva la anterior.</div>';
  if(tab==='hist'){var hs=AUD.filter(function(a){return a.r===p.id});h+=hs.length?'<div class="tl">'+hs.map(function(a){return '<div><b>'+esc(a.a)+'</b> <small>'+esc(a.u)+' · '+a.f+'</small><br><small>'+esc(a.d)+'</small></div>'}).join('')+'</div>':'<div class="empty">Sin eventos en esta sesión de demo.</div>'}
  h+='</div><div class="mf">';
  var ac=acciones(p);
  if(!ac.length)h+='<span style="color:#9aa0a6">Sin acciones disponibles en este estado.</span>';
  ac.forEach(function(a){h+='<button class="btn'+(a.ok?' pri':' no')+'" '+(a.ok?'onclick="aplicar(PROC.filter(function(x){return x.id===\''+p.id+'\'})[0],\''+a.id+'\')"':'onclick="alert(\''+a.why.replace(/'/g,'')+'\')"')+'>'+a.label+'</button>'});
  h+='</div>';
  var mc=document.getElementById('mc');mc.innerHTML=h;document.getElementById('modal').classList.add('on');
}
function closeM(){document.getElementById('modal').classList.remove('on')}
function bind(){
  document.querySelectorAll('[data-id]').forEach(function(r){r.onclick=function(){openProc(r.dataset.id)}});
  document.querySelectorAll('[data-go]').forEach(function(r){r.onclick=function(){filtro.kpi=r.dataset.go;filtro.estado='';view='procesos';render()}});
  document.querySelectorAll('[data-f]').forEach(function(r){r.onclick=function(){filtro.kpi=filtro.kpi===r.dataset.f?'':r.dataset.f;render()}});
  var q=document.getElementById('q');if(q)q.oninput=function(){filtro.q=q.value;var pos=q.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
  var fe=document.getElementById('fe');if(fe)fe.onchange=function(){filtro.estado=fe.value;render()};
  var c=document.getElementById('clr');if(c)c.onclick=function(){filtro.kpi='';render()};
  var nu=document.getElementById('nuevo');if(nu)nu.onclick=nuevoProc;
  var ct=document.getElementById('cat');if(ct)ct.onclick=function(){alert('En la app real: crea 21 procesos en estado Borrador con solo nombre y categoría, SIN pasos, controles ni transacciones inventadas. En este demo no se agregan.')};
  document.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){editRoles(+b.dataset.ed)}});
}
function nuevoProc(){
  var n=prompt('Nombre del nuevo proceso (demo):');if(!n)return;
  var id='PRO-'+('00'+(PROC.length+1)).slice(-3);
  PROC.push({id:id,nombre:n,cat:'Sin categoría',resp:cur.email,part:[],estado:'borrador',vt:1,vp:null,rev:null,versiones:[{n:1,estado:'borrador',creadoPor:cur.email,editores:[cur.email],c:{objetivo:'',alcance:'',riesgos:[],controles:[],pasos:[]}}]});
  log(PROC[PROC.length-1],'crear_proceso',n);render();openProc(id);
}
function editRoles(i){
  var u=USERS[i];
  var h='<div class="mh"><h3>Roles de '+esc(u.nombre)+'</h3><button class="btn" onclick="closeM()">✕</button></div><div class="mb chk">'+
   Object.keys(ROLES).map(function(r){return '<label><input type="checkbox" value="'+r+'" '+(u.roles.indexOf(r)>=0?'checked':'')+'> '+ROLES[r].n+'</label>'}).join('')+
   '<div class="note">Regla de seguridad: siempre debe quedar al menos un Administrador.</div></div><div class="mf"><button class="btn pri" id="sv">Guardar</button></div>';
  document.getElementById('mc').innerHTML=h;document.getElementById('modal').classList.add('on');
  document.getElementById('sv').onclick=function(){
    var sel=[].slice.call(document.querySelectorAll('#mc input:checked')).map(function(x){return x.value});
    var otros=USERS.filter(function(x,j){return j!==i&&x.roles.indexOf('administrador')>=0}).length;
    if(!sel.length){alert('Asigna al menos un rol.');return}
    if(sel.indexOf('administrador')<0&&!otros){alert('Debe quedar al menos un Administrador.');return}
    var ant=u.roles.join(', ');u.roles=sel;log(null,'cambio_roles',u.email+': '+ant+' → '+sel.join(', '));
    if(u===cur)document.getElementById('whoRoles').textContent='';closeM();render();
  };
}
/* ===== ARRANQUE ===== */
var w=document.getElementById('who');
USERS.forEach(function(u,i){var o=document.createElement('option');o.value=i;o.textContent=u.nombre;w.appendChild(o)});
w.onchange=function(){cur=USERS[+w.value];if(view==='usuarios'&&!has('admin')){}render()};
document.querySelectorAll('.nav[data-v]').forEach(function(b){b.onclick=function(){view=b.dataset.v;if(view==='procesos'&&filtro.kpi==='')filtro.estado='';render()}});
document.getElementById('modal').onclick=function(e){if(e.target===this)closeM()};
render();
</script>
</body>
</html>
