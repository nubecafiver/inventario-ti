<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFIVER TI — Centro de Gestión y Control de Tecnología</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<body>

<!-- INICIO DE SESIÓN (mismo proyecto de Firebase y mismas cuentas que la app de inventario) -->
<div id="login-screen" class="hidden">
  <div class="lcard">
    <div class="lmark"><i class="ti ti-shield-check" aria-hidden="true"></i></div>
    <h1>CAFIVER TI</h1>
    <div class="sub">Centro de Gestión y Control de Tecnología</div>
    <div id="login-error" role="alert"></div>
    <form id="login-form" novalidate>
      <div class="campo"><label for="login-email">Correo electrónico</label><input class="fi" type="email" id="login-email" placeholder="correo@cafiver.com.mx" autocomplete="email"></div>
      <div class="campo"><label for="login-pass">Contraseña</label><input class="fi" type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
      <button type="submit" id="login-btn" class="btn btn-blue">Iniciar sesión</button>
    </form>
  </div>
</div>

<!-- APLICACIÓN -->
<div id="app" class="hidden">
  <aside id="side" aria-label="Navegación principal">
    <div class="marca"><div class="logo"><i class="ti ti-shield-check" aria-hidden="true"></i></div><div><b>CAFIVER TI</b><small>Gestión y control de tecnología</small></div></div>
    <nav>
      <button class="tnav" id="tnav-ti-inicio" data-vista="ti-inicio"><i class="ti ti-layout-dashboard tnav-icon" aria-hidden="true"></i>Inicio</button>
      <button class="tnav hidden" id="tnav-ti-procesos" data-vista="ti-procesos"><i class="ti ti-sitemap tnav-icon" aria-hidden="true"></i>Procesos y procedimientos</button>
      <button class="tnav hidden" id="tnav-ti-tickets" data-vista="ti-tickets"><i class="ti ti-headset tnav-icon" aria-hidden="true"></i>Mesa de ayuda</button>
      <a class="tnav" id="tnav-ti-inv" href="../index.html" target="_blank" rel="noopener"><i class="ti ti-devices-pc tnav-icon" aria-hidden="true"></i>Inventario de equipos<i class="ti ti-external-link ext" aria-hidden="true"></i><span class="ti-sr">(se abre en otra pestaña)</span></a>
      <button class="tnav hidden" id="tnav-ti-admin" data-vista="ti-admin"><i class="ti ti-shield-lock tnav-icon" aria-hidden="true"></i>Administración</button>
    </nav>
    <div class="sbpie">
      <div class="quien"><div class="avatar" id="cur-av" aria-hidden="true">?</div><div><b id="cur-nm"></b><small id="cur-rol"></small></div></div>
      <button class="btn btn-sm" id="salir"><i class="ti ti-logout" aria-hidden="true"></i> Cerrar sesión</button>
    </div>
  </aside>
  <div id="principal">
    <div id="topbar"><button id="burger" aria-label="Abrir menú" aria-expanded="false"><i class="ti ti-menu-2" aria-hidden="true"></i></button><b>CAFIVER TI</b></div>
    <main id="ti-main">
      <div id="view-ti-inicio" class="ti-view hidden"></div>
      <div id="view-ti-procesos" class="ti-view hidden"></div>
      <div id="view-ti-tickets" class="ti-view hidden"></div>
      <div id="view-ti-admin" class="ti-view hidden"></div>
    </main>
  </div>
</div>
